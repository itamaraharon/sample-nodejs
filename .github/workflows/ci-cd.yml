name: CI/CD

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  sast:
    name: SAST Scan (SonarCloud)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@0303d6b62e310685c0e34d0b9cde218036885c4d # v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        uses: sonarsource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # master
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  version-bump:
    name: Version Bump
    needs: sast
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.bump.outputs.new_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: bump
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297 # 1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: false

      - name: Output new tag
        run: echo "New version is ${{ steps.bump.outputs.new_tag }}"

  build-scan-push:
    name: Build, Scan & Push Image
    needs: version-bump
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build Docker image
        run: |
          docker build -t itamara/sample-nodejs:${{ needs.version-bump.outputs.new_tag }} \
                       -t itamara/sample-nodejs:latest .

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@6e7b7d1fd3e4fef0c5fa8cce1229c54b2c9bd0d8 # v0.24.0
        with:
          image-ref: 'itamara/sample-nodejs:${{ needs.version-bump.outputs.new_tag }}'
          format: 'table'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image
        if: success()
        run: |
          docker push itamara/sample-nodejs:${{ needs.version-bump.outputs.new_tag }}
          docker push itamara/sample-nodejs:latest

  update-gitops:
    name: Update GitOps Repository
    needs: [ version-bump, build-scan-push ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitOps repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: itamaraharon/sample-nodejs-gitops
          token: ${{ secrets.GITOPS_PAT }}
          path: gitops

      - name: Update image tag in values.yaml
        run: |
          cd gitops/sample-nodejs
          sed -i "s/tag: .*/tag: \"${{ needs.version-bump.outputs.new_tag }}\"/" values.yaml
          cat values.yaml | grep tag:

      - name: Commit and push
        run: |
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sample-nodejs/values.yaml
          git commit -m "Update image tag to ${{ needs.version-bump.outputs.new_tag }}" || echo "No changes to commit"
          git push
